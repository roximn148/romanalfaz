[project]
name = "romanalfaz"
version = "0.1.0a6"
description = "Dictionary based predictive Roman Urdu transliterator"

readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "roximn", email = "roximn148@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]

requires-python = ">=3.10"
dependencies = [
    "symspellpy>=6.9.0",
    "unicodedataplus>=16.0.0.post1",
]
[project.scripts]
romanalfaz = "romanalfaz.cli:main"
[dependency-groups]
dev = [
    "myst-nb>=1.4.0",
    "pyrefly>=1.4.0",
    "pytest>=9.0.3",
    "ruff>=0.17.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["romanalfaz"]

[tool.pyrefly]
preset = "basic"
python-version = "3.10"
# unicodedataplus is a compiled C extension (.pyd) without type stubs
ignore-missing-imports = ["unicodedataplus"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
